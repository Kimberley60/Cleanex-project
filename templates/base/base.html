<!DOCTYPE html>


<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}CLEANEX{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    {% load static %}
        <!-- DESIGN SYSTEM -->
    <link rel="stylesheet" href="{% static 'css/base/variables.css' %}">

    <!-- GLOBAL FOUNDATION -->
    <link rel="stylesheet" href="{% static 'css/main.css' %}">

    <!-- LAYOUT -->
    <link rel="stylesheet" href="{% static 'css/layout/footer.css' %}">
    <link rel="stylesheet" href="{% static 'css/layout/navbar.css' %}">

     <!--  REUSABLE COMPONENTS -->
    <link rel="stylesheet" href="{% static 'css/components/buttons.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/cards.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/service_card.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/testimonial_card.css' %}">

     <!-- INCLUDES -->
    <link rel="stylesheet" href="{% static 'css/includes/hero.css' %}">
    <link rel="stylesheet" href="{% static 'css/includes/how_it_works.css' %}">
    <link rel="stylesheet" href="{% static 'css/includes/trust_bar.css' %}">


    <!-- PAGES -->
    <link rel="stylesheet" href="{% static 'css/pages/booking.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages/account.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages/contact.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages/gallery.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages/home.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages/quote.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages/service_detail.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages/services.css' %}">



    {% block extra_css %}{% endblock %}
</head>


<body>

{% include "components/navbar.html" %}

<main class="main-content">
    {% if messages %}
        <div class="container account-messages" aria-live="polite">
            {% for message in messages %}
                <div
                    class="alert {% if message.tags == 'error' %}alert-danger{% elif message.tags == 'success' %}alert-success{% else %}alert-info{% endif %}"
                    role="status"
                >
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}
    {% block content %}{% endblock %}
</main>

{% include "components/footer.html" %}

<button type="button" class="back-to-top" aria-label="Back to top">
    <i class="bi bi-arrow-up" aria-hidden="true"></i>
</button>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Hero Carousel -->
<script src="{% static 'js/hero.js' %}"></script>
<!-- Navbar -->
<script src="{% static 'js/navbar.js' %}"></script>
<!-- Back to top -->
<script src="{% static 'js/back_to_top.js' %}"></script>


{% block extra_js %}{% endblock %}

</body>
</html>
