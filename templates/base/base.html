<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}CLEANEX{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}">

    <!-- DESIGN SYSTEM -->
    <link rel="stylesheet" href="{% static 'css/base/animations.css' %}">
    <link rel="stylesheet" href="{% static 'css/base/typography.css' %}">
    <link rel="stylesheet" href="{% static 'css/base/utilities.css' %}">
    <link rel="stylesheet" href="{% static 'css/base/variables.css' %}">

    <!-- LAYOUT -->
    <link rel="stylesheet" href="{% static 'css/layout/footer.css' %}">
    <link rel="stylesheet" href="{% static 'css/layout/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'css/layout/sections.css' %}">

     <!--  REUSABLE COMPONENTS -->
    <link rel="stylesheet" href="{% static 'css/components/buttons.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/cards.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/forms.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/service_card.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/testimonial_card.css' %}">

     <!-- INCLUDES -->
    <link rel="stylesheet" href="{% static 'css/includes/hero.css' %}">
    <link rel="stylesheet" href="{% static 'css/includes/cta_section.css' %}">
    <link rel="stylesheet" href="{% static 'css/includes/how_it_works.css' %}">
    <link rel="stylesheet" href="{% static 'css/includes/services_section.css' %}">
    <link rel="stylesheet" href="{% static 'css/includes/testimonials_section.css' %}">
    <link rel="stylesheet" href="{% static 'css/includes/trust_bar.css' %}">


    <!-- PAGES -->
    <link rel="stylesheet" href="{% static 'css/pages/booking.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages/contact.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages/gallery.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages/home.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages/quote.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages/service_detail.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages/service_list.css' %}">



    {% block extra_css %}{% endblock %}
</head>


<body>

{% include "components/navbar.html" %}

<main class="main-content">
    {% block content %}{% endblock %}
</main>

{% include "components/footer.html" %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Hero Carousel -->
<script src="{% static 'js/hero.js' %}"></script>
<!-- Navbar -->
<script src="{% static 'js/navbar.js' %}"></script>


{% block extra_js %}{% endblock %}

</body>
</html>
